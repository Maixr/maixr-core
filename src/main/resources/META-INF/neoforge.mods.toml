modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "${mod_authors}"
description = '''${mod_description}'''

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1.0,)"
ordering = "NONE"
side = "BOTH"

[[dependencies.${mod_id}]]
modId = "minecraft"
type = "required"
versionRange = "[1.21.1,1.21.2)"
ordering = "NONE"
side = "BOTH"

# 玩偶方块实体继承 AE2 的 AENetworkedBlockEntity，没有 AE2 会直接类加载失败
[[dependencies.${mod_id}]]
modId = "ae2"
type = "required"
versionRange = "[19.2,)"
ordering = "AFTER"
side = "BOTH"
